<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Megami Device Radar Chart</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #14110d;
      --bg-2: #20170f;
      --panel: #251b12;
      --panel-2: #2d2116;
      --text: #ffd8a3;
      --muted: #d8a35c;
      --accent: #ff9d1f;
      --accent-2: #ffbf4d;
      --grid: rgba(255, 157, 31, 0.42);
      --grid-soft: rgba(255, 157, 31, 0.22);
      --line: rgba(255, 52, 52, 0.98);
      --fill: rgba(255, 52, 52, 0.28);
      --bar: linear-gradient(90deg, #ff9d1f 0%, #ffbf4d 100%);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Courier New", "Lucida Console", "IBM Plex Mono", monospace;
      background:
        radial-gradient(circle at top, rgba(255, 157, 31, 0.12), transparent 34%),
        linear-gradient(180deg, #090705 0%, var(--bg) 100%);
      color: var(--text);
      overflow-x: hidden;
    }

    .wrap {
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 40px;
    }

    h1 {
      margin: 0 0 18px 0;
      font-size: clamp(28px, 4vw, 44px);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      text-shadow: 0 0 12px rgba(255, 157, 31, 0.18);
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(320px, 0.7fr);
      gap: 18px;
      align-items: start;
      overflow: hidden;
    }

    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      border: 1px solid rgba(255, 157, 31, 0.18);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.42);
      backdrop-filter: blur(10px);
      overflow: hidden;
    }

    .chart-card {
      padding: 18px;
      min-height: 720px;
      background:
        linear-gradient(180deg, rgba(255, 157, 31, 0.04), transparent 30%),
        linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
    }

    .side-card {
      padding: 18px;
      display: grid;
      gap: 16px;
      background:
        linear-gradient(180deg, rgba(255, 157, 31, 0.05), transparent 30%),
        linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
    }

    .name-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      width: fit-content;
      padding: 10px 14px;
      background: rgba(255, 157, 31, 0.12);
      border: 1px solid rgba(255, 157, 31, 0.38);
      border-radius: 999px;
      color: var(--accent-2);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .stat-list {
      display: grid;
      gap: 10px;
      width: 100%;
      min-width: 0;
    }

    .stat-row {
      display: grid;
      grid-template-columns: 68px minmax(0, 1fr) 44px;
      gap: 12px;
      align-items: center;
      min-width: 0;
      width: 100%;
      overflow: hidden;
    }

    .abbr {
      color: var(--accent);
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .label {
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    .value {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: var(--accent-2);
    }

    .bar {
      grid-column: 2 / 4;
      height: 10px;
      border-radius: 999px;
      background: rgba(255, 157, 31, 0.10);
      overflow: hidden;
      position: relative;
      width: 100%;
      border: 1px solid rgba(255, 157, 31, 0.18);
    }

    .bar > span {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: var(--w, 0%);
      background: var(--bar);
      border-radius: 999px;
      max-width: 100%;
      box-shadow: 0 0 12px rgba(255, 157, 31, 0.25);
    }

    canvas {
      width: 100% !important;
      height: 640px !important;
    }

    @media (max-width: 980px) {
      .grid { grid-template-columns: 1fr; }
      .chart-card { min-height: 520px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 id="title">Megami Device Radar Chart</h1>

    <div class="grid">
      <section class="card chart-card">
        <canvas id="radar"></canvas>
      </section>

      <aside class="card side-card">
        <div class="name-pill">
          <span id="name">Unnamed Megami</span>
        </div>

        <div class="stat-list" id="statList"></div>
      </aside>
    </div>
  </div>

<script>
const AXES = [
  { key: 'sra', short: 'SRA', label: 'Short Range Attack' },
  { key: 'mra', short: 'MRA', label: 'Mid Range Attack' },
  { key: 'lra', short: 'LRA', label: 'Long Range Attack' },
  { key: 'arm', short: 'ARM', label: 'Armor' },
  { key: 'wgt', short: 'WGT', label: 'Weight' },
  { key: 'end', short: 'END', label: 'Endurance' },
  { key: 'stl', short: 'STL', label: 'Stealth' },
  { key: 'src', short: 'SRC', label: 'Search' },
  { key: 'aem', short: 'AEM', label: 'Aerial Mobility' },
  { key: 'grm', short: 'GRM', label: 'Ground Mobility' }
];

function clamp(n, min, max) { return Math.min(max, Math.max(min, n)); }

function parseStat(v) {
  if (v == null || v === '') return 10;
  const n = Number(v);
  if (!Number.isFinite(n)) return 10;
  return clamp(n, 0, 100);
}

function getParams() {
  const p = new URLSearchParams(location.search);
  const d = { name: p.get('name') || 'Unnamed Megami' };
  AXES.forEach(a => d[a.key] = parseStat(p.get(a.key)));
  return d;
}

let chart;
let data;

function updateRadar() {
  chart.data.datasets[0].data = AXES.map(a => data[a.key] / 10);
  chart.update();
}

function render() {
  document.getElementById('title').textContent = `${data.name} — STATS`;
  document.getElementById('name').textContent = data.name;

  const list = document.getElementById('statList');
  list.innerHTML = AXES.map(a => {
    const v = data[a.key];
    const pct = v;
    return `
      <div class="stat-row">
        <div class="abbr">${a.short}</div>
        <div class="label">${a.label}</div>
        <div class="value">${v}</div>
        <div class="bar"><span style="--w:${pct}%"></span></div>
      </div>
    `;
  }).join('');
}

function init() {
  data = getParams();

  chart = new Chart(document.getElementById('radar'), {
    type: 'radar',
    data: {
      labels: AXES.map(a => a.short),
      datasets: [{
        data: AXES.map(a => data[a.key] / 10),
        borderColor: '#ff3434',
        backgroundColor: 'rgba(255, 52, 52, 0.30)',
        pointBackgroundColor: '#ff3434',
        pointBorderColor: '#ff9d1f',
        pointRadius: 4,
        pointHoverRadius: 5,
        borderWidth: 3,
        fill: true,
        tension: 0
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false }
      },
      elements: {
        line: {
          borderJoinStyle: 'miter'
        }
      },
      scales: {
        r: {
          min: 0,
          max: 10,
          ticks: {
            stepSize: 2,
            color: 'rgba(255, 191, 77, 0.82)',
            backdropColor: 'transparent',
            showLabelBackdrop: false,
            font: {
              family: 'Courier New, Lucida Console, IBM Plex Mono, monospace',
              size: 12,
              weight: '700'
            }
          },
          angleLines: {
            color: 'rgba(255, 157, 31, 0.65)',
            borderDash: [4, 4],
            lineWidth: 1.5
          },
          grid: {
            color: 'rgba(255, 157, 31, 0.55)',
            borderDash: [6, 4],
            lineWidth: 1.5,
            circular: true
          },
          pointLabels: {
            color: '#ff9d1f',
            font: {
              family: 'Courier New, Lucida Console, IBM Plex Mono, monospace',
              size: 14,
              weight: '700'
            }
          }
        }
      }
    }
  });

  render();
  updateRadar();
}

init();
</script>
</body>
</html>
