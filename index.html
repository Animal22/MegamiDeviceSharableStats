<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Megami Device Radar Chart</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <style>
    :root {
      --bg: #14110d;
      --bg-2: #20170f;
      --panel: #251b12;
      --panel-2: #2d2116;
      --text: #ffd8a3;
      --muted: #d8a35c;
      --accent: #ff9d1f;
      --accent-2: #ffbf4d;
      --grid: #ffd8a3;
      --grid-soft: #ffd8a3;
      --line: rgba(255, 52, 52, 0.98);
      --fill: rgba(255, 52, 52, 0.28);
      --bar: linear-gradient(90deg, #ff9d1f 0%, #ffbf4d 100%);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Courier New", "Lucida Console", "IBM Plex Mono", monospace;
      background:
        radial-gradient(circle at top, rgba(255, 157, 31, 0.12), transparent 34%),
        linear-gradient(180deg, #090705 0%, var(--bg) 100%);
      color: var(--text);
      overflow-x: hidden;
    }

    .wrap {
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 40px;
    }

    h1 {
      margin: 0 0 18px 0;
      font-size: clamp(28px, 4vw, 44px);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      text-shadow: 0 0 12px rgba(255, 157, 31, 0.18);
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(320px, 0.7fr);
      gap: 18px;
      align-items: start;
      overflow: hidden;
    }

    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      border: 1px solid rgba(255, 157, 31, 0.18);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.42);
      backdrop-filter: blur(10px);
      overflow: hidden;
    }

    .chart-card {
      padding: 18px;
      min-height: 720px;
      background:
        linear-gradient(180deg, rgba(255, 157, 31, 0.04), transparent 30%),
        linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      position: relative;
    }

    .side-card {
      padding: 18px;
      display: grid;
      gap: 16px;
      background:
        linear-gradient(180deg, rgba(255, 157, 31, 0.05), transparent 30%),
        linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
    }

    .name-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 6px 12px;
      background: rgba(255, 157, 31, 0.12);
      border: 1px solid rgba(255, 157, 31, 0.38);
      border-radius: 999px;
      color: var(--accent-2);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    #nameInput {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--accent-2);
      font-family: "Courier New", "Lucida Console", "IBM Plex Mono", monospace;
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
    }

    #nameInput::placeholder {
      color: rgba(255, 191, 77, 0.5);
    }

    .stat-list {
      display: grid;
      gap: 10px;
      width: 100%;
      min-width: 0;
    }

    .stat-row {
      display: grid;
      grid-template-columns: 68px minmax(0, 1fr) 44px;
      gap: 12px;
      align-items: center;
      min-width: 0;
      width: 100%;
      overflow: hidden;
    }

    .abbr {
      color: var(--accent);
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .label {
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    .value {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: var(--accent-2);
      background: #000;
      border: 1px solid rgba(255, 157, 31, 0.25);
      border-radius: 6px;
      padding: 2px 4px;
      font-family: "Courier New", "Lucida Console", "IBM Plex Mono", monospace;
    }

    .bar {
      grid-column: 2 / 4;
      height: 10px;
      border-radius: 999px;
      background: rgba(255, 157, 31, 0.10);
      overflow: hidden;
      position: relative;
      width: 100%;
      border: 1px solid rgba(255, 157, 31, 0.18);
    }

    .bar > span {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: var(--w, 0%);
      background: var(--bar);
      border-radius: 999px;
      max-width: 100%;
      box-shadow: 0 0 12px rgba(255, 157, 31, 0.25);
    }

    #urlBox {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .url-label {
      color: var(--accent);
      font-weight: 700;
      letter-spacing: 0.08em;
      font-size: 13px;
    }

    #shareUrl {
      width: 100%;
      min-height: 90px;
      resize: vertical;
      background: rgba(255, 157, 31, 0.08);
      border: 1px solid rgba(255, 157, 31, 0.18);
      border-radius: 12px;
      color: var(--text);
      padding: 12px;
      font-family: "Courier New", "Lucida Console", "IBM Plex Mono", monospace;
      font-size: 13px;
      line-height: 1.4;
      outline: none;
    }

    canvas {
      width: 100% !important;
      height: 640px !important;
    }

    /* TOTAL MOVED INTO RADAR PANEL */
    #totalBox {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(255, 157, 31, 0.12);
      border: 1px solid rgba(255, 157, 31, 0.38);
      color: var(--accent-2);
      font-family: "Courier New", "Lucida Console", "IBM Plex Mono", monospace;
      font-weight: 700;
      padding: 8px 12px;
      border-radius: 12px;
      z-index: 5;
      letter-spacing: 0.05em;
    }

    @media (max-width: 980px) {
      .grid { grid-template-columns: 1fr; }
      .chart-card { min-height: 520px; }
    }
  </style>
</head>

<body>

<div class="wrap">

  <h1 id="title">Megami Device Radar Chart</h1>

  <div class="grid">

    <section class="card chart-card">
      <div id="totalBox"></div>
      <canvas id="radar"></canvas>
    </section>

    <aside class="card side-card">
      <div class="name-pill">
        <input id="nameInput" type="text" value="Unnamed Megami" />
      </div>

      <div class="stat-list" id="statList"></div>

      <div id="urlBox">
        <div class="url-label">SHARE URL</div>
        <textarea id="shareUrl" readonly></textarea>
      </div>
    </aside>

  </div>
</div>

<script>

const AXES = [
  { key: 'sra', short: 'SRA', label: 'Short Range Attack' },
  { key: 'mra', short: 'MRA', label: 'Mid Range Attack' },
  { key: 'lra', short: 'LRA', label: 'Long Range Attack' },
  { key: 'arm', short: 'ARM', label: 'Armor' },
  { key: 'wgt', short: 'WGT', label: 'Weight' },
  { key: 'end', short: 'END', label: 'Endurance' },
  { key: 'stl', short: 'STL', label: 'Stealth' },
  { key: 'src', short: 'SRC', label: 'Search' },
  { key: 'aem', short: 'AEM', label: 'Aerial Mobility' },
  { key: 'grm', short: 'GRM', label: 'Ground Mobility' }
];

function clamp(n, min, max) {
  return Math.min(max, Math.max(min, n));
}

function parseStat(v) {
  if (v == null || v === '') return 10;
  const n = Number(v);
  if (!Number.isFinite(n)) return 10;
  return clamp(n, 0, 100);
}

function getParams() {
  const p = new URLSearchParams(location.search);
  const d = { name: p.get('name') || 'Unnamed Megami' };
  AXES.forEach(a => d[a.key] = parseStat(p.get(a.key)));
  return d;
}

let chart;
let data;

function updateRadar() {
  chart.data.datasets[0].data = AXES.map(a => data[a.key]);
  chart.update();
}

function updateShareURL() {
  const params = new URLSearchParams();
  params.set('name', data.name);
  AXES.forEach(a => params.set(a.key, data[a.key]));
  const url = `${location.origin}${location.pathname}?${params.toString()}`;
  document.getElementById('shareUrl').value = url;
}

function updateBars() {
  document.querySelectorAll('.stat-input').forEach(input => {
    const key = input.dataset.key;
    const row = input.closest('.stat-row');
    const span = row.querySelector('.bar span');
    span.style.setProperty('--w', `${data[key]}%`);
  });
}

/* TOTAL */
function updateTotal() {
  const total = AXES.reduce((sum, a) => sum + (data[a.key] || 0), 0);
  document.getElementById('totalBox').textContent = `TOTAL: ${total}`;
}

function render() {
  document.getElementById('title').textContent = `${data.name} — STATS`;
  document.getElementById('nameInput').value = data.name;

  const list = document.getElementById('statList');
  list.innerHTML = AXES.map(a => {
    const v = data[a.key];
    return `
      <div class="stat-row">
        <div class="abbr">${a.short}</div>
        <div class="label">${a.label}</div>
        <input class="value stat-input" type="number" min="0" max="100"
          value="${v}" data-key="${a.key}" />
        <div class="bar"><span style="--w:${v}%"></span></div>
      </div>
    `;
  }).join('');

  document.querySelectorAll('.stat-input').forEach(input => {
    input.addEventListener('input', () => {
      const key = input.dataset.key;
      data[key] = clamp(Number(input.value) || 0, 0, 100);

      updateRadar();
      updateBars();
      updateShareURL();
      updateTotal();
    });
  });

  document.getElementById('nameInput').addEventListener('input', (e) => {
    data.name = e.target.value || 'Unnamed Megami';
    document.getElementById('title').textContent = `${data.name} — STATS`;
    updateShareURL();
    updateTotal();
  });
}

const centerCirclePlugin = {
  id: 'centerCircleMask',
  afterDraw(chart) {
    const { ctx, chartArea } = chart;
    if (!chartArea) return;

    const x = (chartArea.left + chartArea.right) / 2;
    const y = (chartArea.top + chartArea.bottom) / 2;

    const radius = Math.min(
      chartArea.right - chartArea.left,
      chartArea.bottom - chartArea.top
    ) * 0.08;

    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 157, 31, 1)';
    ctx.fill();
    ctx.restore();
  }
};

function init() {
  data = getParams();

  chart = new Chart(document.getElementById('radar'), {
    type: 'radar',
    data: {
      labels: AXES.map(a => a.short),
      datasets: [{
        data: AXES.map(a => data[a.key]),
        borderColor: '#ff3434',
        backgroundColor: 'rgba(255, 31, 31, 0.3',
        pointBackgroundColor: '#ff3434',
        pointBorderColor: '#ff9d1f',
        pointRadius: 0,
        pointHoverRadius: 0,
        borderWidth: 3,
        fill: true
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        r: {
          min: -20,
          max: 100,
          ticks: { stepSize: 10, display: false },
          angleLines: {
            color: '#ff3434',
            borderDash: [4, 4],
            lineWidth: 1.5
          },
          grid: {
            color: (ctx) => {
              const v = ctx.tick.value;
              if (v === 50 || v === 100) return 'rgba(255, 157, 31, 0.90)';
              return 'rgba(255, 157, 31, 0.45)';
            },
            lineWidth: (ctx) => {
              const v = ctx.tick.value;
              return (v === 50 || v === 100) ? 3 : 1.5;
            },
            circular: true
          },
          pointLabels: {
            color: '#ff9d1f',
            font: {
              family: 'Courier New, Lucida Console, IBM Plex Mono, monospace',
              size: 14,
              weight: '700'
            }
          }
        }
      }
    },
    plugins: [centerCirclePlugin]
  });

  render();
  updateRadar();
  updateBars();
  updateShareURL();
  updateTotal();
}

init();
</script>

</body>
</html>
